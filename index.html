      [1,"千机变(杭州)科技有限公司","4-202","王玉松","以自主研发算法为核心竞争力，打造承载 300+ 自研算法的一站式 AI 算法超市底座。","市场拓展需求、资源扶持需求、产业合作需求"],

      return <main className="main">
        <section className="hero">
          <div><div className="eyebrow"><span className="pulse"/> 园区供需撮合 · 2026</div><h1>把能力放上来，<br/>让<em>合作发生</em></h1><p>发布企业可开放的技术、产品或资源需求，快速找到园区里能接得住的合作伙伴。</p></div>
          <div className="metrics"><div className="metric"><b>46</b><span>供应能力</span></div><div className="metric"><b>46</b><span>链接需求</span></div></div>
        </section>
        <section className="page-toolbar">
          <div className="page-search"><Icon name="search"/><input value={search} onChange={e=>setSearch(e.target.value)} placeholder="搜索能力、需求或企业名称…"/></div>
          <div className="page-filters">
            <button className={type==='all'?'active':''} onClick={()=>setType('all')}>全部</button>
            <button className={type==='supply'?'active':''} onClick={()=>setType('supply')}><Icon name="sparkles" size={14}/> 可提供</button>
            <button className={type==='demand'?'active':''} onClick={()=>setType('demand')}><Icon name="link" size={14}/> 想链接</button>
          </div>
          <select value={category} onChange={e=>setCategory(e.target.value)}>
            <option value="all">全部方向</option>
            {categories.map(c => <option key={c} value={c}>{c}</option>)}
          </select>
        </section>
        <section className="card-grid">
          {filtered.length ? filtered.map(item => <article className="resource-card" key={`${item.id}-${item.kind}`}>
            <div className="resource-card-head">
              <span className={`resource-kind ${item.kind}`}>{item.kind==='supply'?'可提供':'想链接'}</span>
              <span className="resource-room">{item.address}</span>
            </div>
            <h3 onClick={()=>onOpenEnterprise(item)}>{item.name}</h3>
            <p>{item.content}</p>
            <div className="tagrow">
              {item.tags.slice(0,3).map(t => <span className={item.kind==='supply'?'tag':'tag need'} key={t}>{t}</span>)}
            </div>
            <div className="resource-actions">
              <button className="btn primary" onClick={()=>{setToast('对接意向已记录，运营人员将协助撮合');}}>发起对接 <Icon name="send" size={14}/></button>
              <button className="btn" onClick={()=>onOpenEnterprise(item)}>查看档案</button>
            </div>
          </article>) : <div className="empty wide"><div><Icon name="telescope" size={30}/><b>暂未找到匹配内容</b><span>试试调整筛选条件或搜索关键词</span></div></div>}
        </section>
      </main>;
    }

    function AbilityIndex({onOpenEnterprise}){
      const [selectedTag,setSelectedTag] = useState(null);
      const [search,setSearch] = useState("");

      const abilityTags = useMemo(() => {
        const map = {};
        enterpriseData.forEach(e => {
          tagsFor(e.ability,'ability').forEach(t => {
            if(!map[t]) map[t] = [];
            map[t].push(e);
          });
        });
        return map;
      },[]);

      const needTags = useMemo(() => {
        const map = {};
        enterpriseData.forEach(e => {
          tagsFor(e.need,'need').forEach(t => {
            if(!map[t]) map[t] = [];
            map[t].push(e);
          });
        });
        return map;
      },[]);

      const allTags = Array.from(new Set([...Object.keys(abilityTags), ...Object.keys(needTags)]));
      const matched = useMemo(() => {
        if(!selectedTag && !search) return [];
        return enterpriseData.filter(e => {
          const tagHit = !selectedTag || tagsFor(e.ability,'ability').includes(selectedTag) || tagsFor(e.need,'need').includes(selectedTag);
          const searchHit = !search || `${e.name}${e.ability}${e.need}`.toLowerCase().includes(search.toLowerCase());
          return tagHit && searchHit;
        });
      },[selectedTag,search]);

      return <main className="main">
        <section className="hero">
          <div><div className="eyebrow"><span className="pulse"/> 企业能力索引 · 2026</div><h1>按能力找人，<br/>按<em>标签连接</em></h1><p>把散落在各栋楼里的技术能力按标签重新组织，快速定位园区里谁能解决你的问题。</p></div>
          <div className="metrics"><div className="metric"><b>{allTags.length}</b><span>能力标签</span></div><div className="metric"><b>46</b><span>收录企业</span></div><div className="metric"><b>16</b><span>技术方向</span></div></div>
        </section>
        <section className="page-toolbar">
          <div className="page-search"><Icon name="search"/><input value={search} onChange={e=>setSearch(e.target.value)} placeholder="搜索技术能力、企业或需求…"/></div>
          {selectedTag && <button className="btn active-tag" onClick={()=>setSelectedTag(null)}>{selectedTag} <Icon name="x" size={12}/></button>}
        </section>
        <section className="tag-cloud">
          <div className="cloud-section">
            <h3><Icon name="sparkles" size={15}/> 开放能力</h3>
            <div className="cloud">
              {Object.entries(abilityTags).sort((a,b)=>b[1].length-a[1].length).map(([tag,list]) => <button key={tag} className={selectedTag===tag?'active':''} onClick={()=>setSelectedTag(tag)}>{tag} <span>{list.length}</span></button>)}
            </div>
          </div>
          <div className="cloud-section">
            <h3><Icon name="link" size={15}/> 链接需求</h3>
            <div className="cloud">
              {Object.entries(needTags).sort((a,b)=>b[1].length-a[1].length).map(([tag,list]) => <button key={tag} className={selectedTag===tag?'active':''} onClick={()=>setSelectedTag(tag)}>{tag} <span>{list.length}</span></button>)}
            </div>
          </div>
        </section>
        {(selectedTag || search) && <section className="card-grid">
          {matched.length ? matched.map(e => <article className="resource-card" key={e.id}>
            <div className="resource-card-head"><span className="resource-kind supply">企业档案</span><span className="resource-room">{e.address}</span></div>
            <h3 onClick={()=>onOpenEnterprise(e)}>{e.name}</h3>
            <p>{e.ability}</p>
            <div className="tagrow">
              {tagsFor(e.ability,'ability').slice(0,2).map(t => <span className="tag" key={t}>{t}</span>)}
              {tagsFor(e.need,'need').slice(0,1).map(t => <span className="tag need" key={t}>{t}</span>)}
            </div>
          </article>) : <div className="empty wide"><div><Icon name="telescope" size={30}/><b>暂未找到匹配企业</b><span>换个标签或清空搜索再试</span></div></div>}
        </section>}
      </main>;
    }

    function EnterpriseModal({enterprise,onClose,setToast}){
      if(!enterprise) return null;
      return <div className="modal-backdrop" style={{width:'min(690px,calc(100vw - 40px))',padding:0}} onMouseDown={e=>e.target===e.currentTarget&&onClose()}>
        <div className="modal-head"><div><div className="side-kicker">ENTERPRISE PROFILE · NO.{String(enterprise.id).padStart(2,'0')}</div><h2>{enterprise.name}</h2></div><button className="icon-btn" onClick={onClose}><Icon name="x"/></button></div>
        <div className="detail-body"><div className="detail-meta"><span className="meta-pill"><Icon name="building-2" size={12}/> {enterprise.address}</span><span className="meta-pill"><Icon name="user-round" size={12}/> {enterprise.contact}</span></div><div className="info-block ability"><label><Icon name="sparkles"/> 可提供的能力</label><p>{enterprise.ability}</p></div><div className="info-block need"><label><Icon name="link"/> 想链接的资源</label><p>{enterprise.need || '期待与园区伙伴探索合作机会'}</p></div><div style={{display:'flex',justifyContent:'flex-end',marginTop:18}}><button className="btn primary" onClick={()=>{setToast('合作意向已记录，运营人员将协助对接');onClose();}}>发起资源连接 <Icon name="send" size={14}/></button></div></div>
      </div>;
    }

    function FormModal({onClose,setToast}){
      const initial = {companyName:'',building:'',room:'',contact:'',phone:'',capability:'',demand:'',updateType:'update',remarks:''};
      const [form,setForm] = useState(initial);
      const [submitted,setSubmitted] = useState(false);
      const [submitting,setSubmitting] = useState(false);
      const [errors,setErrors] = useState({});

      const buildingOptions = ["2","3","4","5","6","8","9","10","11","15","其他"];
      const updateOptions = [
        {value:'update',label:'信息更新',desc:'更新现有信息'},
        {value:'new',label:'新增企业',desc:'首次录入'},
        {value:'correct',label:'信息纠错',desc:'修正错误信息'}
      ];

      function change(field,value){
        setForm(prev=>({...prev,[field]:value}));
        if(errors[field]) setErrors(prev=>({...prev,[field]:undefined}));
      }

      function validate(){
        const next = {};
        if(!form.companyName.trim()) next.companyName = '请填写企业名称';
        if(!form.contact.trim()) next.contact = '请填写联系人姓名';
        if(!form.capability.trim()) next.capability = '请填写供应能力描述';
        if(!form.demand.trim()) next.demand = '请填写链接需求描述';
        setErrors(next);
        return Object.keys(next).length === 0;
      }

      function downloadCSV(){
        const headers = ['提交时间','企业名称','楼栋','房间号','联系人','联系电话','供应能力','链接需求','更新类型','补充说明'];
        const row = [
          new Date().toLocaleString('zh-CN'),
          form.companyName,
          form.building,
          form.room,
          form.contact,
          form.phone,
          form.capability,
          form.demand,
          updateOptions.find(o=>o.value===form.updateType).label,
          form.remarks
        ];
        const csv = [headers, row].map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
        const blob = new Blob(['\ufeff'+csv], {type:'text/csv;charset=utf-8;'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `南湖技术地图-企业信息更新-${form.companyName || '未命名'}-${Date.now()}.csv`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }

      function handleSubmit(e){
        e.preventDefault();
        if(!validate()) return;
        setSubmitting(true);
        setTimeout(()=>{
          setSubmitting(false);
          downloadCSV();
          setSubmitted(true);
        },1200);
      }

      function reset(){
        setForm(initial);
        setSubmitted(false);
        setErrors({});
      }

      if(submitted){
        return <div className="modal-backdrop" style={{width:'min(480px,calc(100vw - 40px))',padding:'42px 34px 38px',textAlign:'center'}} onMouseDown={e=>e.target===e.currentTarget&&onClose()}>
          <div className="success-icon"><Icon name="check-circle" size={40}/></div>
          <h2>提交成功！</h2>
          <p>感谢 <b>{form.companyName || '贵企业'}</b> 提交信息更新申请。</p>
          <p className="sub">运营人员将在 1-3 个工作日内通过您预留的电话与您确认，审核完成后地图数据将同步更新。</p>
          <div className="summary">
            <div className="summary-title">提交内容摘要</div>
            {form.capability && <div className="summary-row"><Icon name="zap" size={13}/><span>{form.capability}</span></div>}
            {form.demand && <div className="summary-row"><Icon name="target" size={13}/><span>{form.demand}</span></div>}
          </div>
          <p style={{fontSize:12,color:'var(--muted)',marginTop:-12,marginBottom:18}}>运营人员入口：提交记录已自动导出为 CSV 文件，请在浏览器下载目录查看汇总。</p>
          <div className="form-actions">
            <button className="btn" onClick={onClose}>返回地图</button>
            <button className="btn primary" onClick={reset}>继续提交</button>
          </div>
        </div>;
      }

      return <div className="modal-backdrop" style={{width:'min(680px,calc(100vw - 40px))',padding:0}} onMouseDown={e=>e.target===e.currentTarget&&onClose()}>
        <div className="modal-head"><div><div className="side-kicker">JOIN THE ATLAS</div><h2>企业信息更新</h2></div><button className="icon-btn" onClick={onClose}><Icon name="x"/></button></div>
        <p className="modal-sub">填写最新的企业供应能力与链接需求，帮助园区内企业更好地发现合作机会</p>
        <form className="new-form" onSubmit={handleSubmit}>

          <div className="form-section">
            <div className="section-title"><Icon name="building-2" size={15}/> 基本信息</div>
            <div className="form-row">
              <div className="field full">
                <label>企业名称 <span className="required">*</span></label>
                <input value={form.companyName} onChange={e=>change('companyName',e.target.value)} placeholder="请输入完整企业名称" className={errors.companyName?'error':''}/>
                {errors.companyName && <span className="error-msg">{errors.companyName}</span>}
              </div>
            </div>
            <div className="form-row two">
              <div className="field">
                <label><Icon name="map-pin" size={11}/> 楼栋</label>
                <select value={form.building} onChange={e=>change('building',e.target.value)}>
                  <option value="">请选择楼栋</option>
                  {buildingOptions.map(b=><option key={b} value={b}>{b==='其他'?'其他':`${b}号楼`}</option>)}
                </select>
              </div>
              <div className="field">
                <label>房间号</label>
                <input value={form.room} onChange={e=>change('room',e.target.value)} placeholder="如：301"/>
              </div>
            </div>
            <div className="form-row two">
              <div className="field">
                <label><Icon name="user" size={11}/> 联系人 <span className="required">*</span></label>
                <input value={form.contact} onChange={e=>change('contact',e.target.value)} placeholder="姓名" className={errors.contact?'error':''}/>
                {errors.contact && <span className="error-msg">{errors.contact}</span>}
              </div>
              <div className="field">
                <label><Icon name="phone" size={11}/> 联系电话</label>
                <input type="tel" value={form.phone} onChange={e=>change('phone',e.target.value)} placeholder="手机号码"/>
              </div>
            </div>
          </div>

          <div className="form-section">
            <div className="section-title"><Icon name="zap" size={15}/> 供应能力与链接需求</div>
            <div className="field full">
              <label className="supply-label">供应能力描述 <span className="required">*</span></label>
              <textarea value={form.capability} onChange={e=>change('capability',e.target.value)} rows="3" placeholder="一句话描述企业核心供应能力，如：提供无人机飞控系统研发与集成服务…" className={errors.capability?'error':''}/>
              {errors.capability && <span className="error-msg">{errors.capability}</span>}
            </div>
            <div className="field full">
              <label className="demand-label">链接需求描述 <span className="required">*</span></label>
              <textarea value={form.demand} onChange={e=>change('demand',e.target.value)} rows="3" placeholder="描述企业当前最迫切的合作需求，如：寻求政企客户资源、行业渠道合作伙伴…" className={errors.demand?'error':''}/>
              {errors.demand && <span className="error-msg">{errors.demand}</span>}
            </div>
          </div>

          <div className="form-section">
            <div className="section-title">更新类型</div>
            <div className="update-type">
              {updateOptions.map(opt=><button type="button" key={opt.value} className={form.updateType===opt.value?'active':''} onClick={()=>change('updateType',opt.value)}>
                <b>{opt.label}</b><span>{opt.desc}</span>
              </button>)}
            </div>
            <div className="field full" style={{marginTop:14}}>
              <label>补充说明（选填）</label>
              <textarea value={form.remarks} onChange={e=>change('remarks',e.target.value)} rows="2" placeholder="其他需要说明的内容…"/>
            </div>
          </div>

          <div className="form-actions">
            <button type="button" className="btn" onClick={reset}>重置</button>
            <button type="submit" className="btn primary" disabled={submitting}>
              {submitting ? <><span className="spinner"/> 提交中…</> : <><Icon name="send" size={14}/> 提交更新申请</>}
            </button>
          </div>
        </form>
      </div>;
    }

    function App(){
      const [page,setPage] = useState("map");
      const [modal,setModal] = useState(null);
      const [toast,setToast] = useState("");

      const navItems = [
        {key:'map',label:'园区地图'},
        {key:'square',label:'资源广场'},
        {key:'index',label:'能力索引'}
      ];

      return <div className="app">
        <header className="topbar">
          <div className="brand"><div className="brand-mark"><Icon name="map-pinned" size={22}/></div><div className="brand-copy"><strong>南湖技术地图</strong><span>NANHU TECH ATLAS</span></div></div>
          <nav className="nav">{navItems.map(item => <button key={item.key} className={page===item.key?'active':''} onClick={()=>setPage(item.key)}>{item.label}</button>)}</nav>
          <button className="admin-btn" onClick={()=>setModal('form')}><Icon name="plus" size={15}/> 提交企业信息</button>
        </header>

        {page === 'map' && <MapPage onOpenForm={()=>setModal('form')} setToast={setToast} onOpenEnterprise={e=>setModal(e)}/>}
        {page === 'square' && <ResourceSquare setToast={setToast} onOpenEnterprise={e=>setModal(e)}/>}
        {page === 'index' && <AbilityIndex onOpenEnterprise={e=>setModal(e)}/>}

        {modal === 'form' && <FormModal onClose={()=>setModal(null)} setToast={setToast}/>}
        {modal && modal !== 'form' && <EnterpriseModal enterprise={modal} onClose={()=>setModal(null)} setToast={setToast}/>}
        {toast && <div className="toast"><Icon name="circle-check"/> {toast}</div>}
      </div>;
    }

    ReactDOM.render(<App/>, document.getElementById('root'));
  </script>
</body>
</html>
